# NounoursOS Server — SSH durci
# Pas de connexion root directe.
PermitRootLogin no
# Connexion par clé uniquement. Pour l'activer :
#   ssh-copy-id utilisateur@serveur   (depuis ton PC, AVANT de passer à "no")
# Par défaut on laisse le mot de passe pour ne pas se bloquer au 1er démarrage.
PasswordAuthentication yes
MaxAuthTries 4
X11Forwarding no
