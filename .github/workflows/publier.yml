name: Publier le dépôt APT NounoursOS

# Chaque push sur main qui touche NounoursOS reconstruit les paquets
# et republie le dépôt. Lançable aussi à la main (onglet Actions).
on:
  push:
    branches: [main]
    paths:
      - "iso/**"
      - "nouveautes/**"
      - "scripts/**"
      - "src/**"
      - "depot.conf"
      - ".github/workflows/publier.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"   # chaque jour : dernières versions de WinBoat, NounoursLauncher, NounoursBrowser

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # nombre de commits = numéro de version des paquets

      - name: Importer la clé de signature
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::Le secret GPG_PRIVATE_KEY est manquant. Lance scripts/creer-cle.sh (voir README)."
            exit 1
          fi
          # gpg renvoie un code d'erreur au moindre avertissement (ligne en trop
          # dans le secret…) même quand l'import réussit : on vérifie nous-mêmes.
          printf '%s\n' "$GPG_PRIVATE_KEY" | sed 's/\r$//' | gpg --batch --import || true
          if ! gpg --list-secret-keys --with-colons | grep -q '^sec'; then
            echo "::error::La clé privée n'a pas pu être importée. Vérifie le contenu du secret GPG_PRIVATE_KEY."
            exit 1
          fi
          gpg --list-secret-keys

      - name: Outils
        run: sudo apt-get update -q && sudo apt-get install -y -q apt-utils xz-utils

      - name: Compiler le pont Paramètres ↔ modules KDE (Debian 13)
        run: |
          mkdir -p dist-pont
          docker run --rm -v "$PWD:/src" -w /src debian:trixie bash -c "
            set -e
            apt-get update -q
            DEBIAN_FRONTEND=noninteractive apt-get install -y -q g++ cmake qt6-base-dev \
              libkf6kcmutils-dev libkf6coreaddons-dev >/dev/null
            cmake -S src/kcm-pont -B /tmp/b -DCMAKE_BUILD_TYPE=Release
            cmake --build /tmp/b
            install -m644 /tmp/b/libnounoursos-kcm.so dist-pont/
          "
          ls -l dist-pont

      - name: Construire les paquets
        env:
          GH_TOKEN: ${{ github.token }}
          BROWSER_TOKEN: ${{ secrets.NOUNOURS_BROWSER_TOKEN }}
        run: ./scripts/construire-paquets.sh

      - name: Construire le dépôt signé
        run: ./scripts/construire-depot.sh

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
