name: Construire les ISO NounoursOS

# - À la main (onglet Actions > « Construire les ISO NounoursOS » > Run workflow)
#   -> ISO téléchargeables dans le run (section Artifacts, 7 jours)
#      + Release GitHub si « publier » est coché.
# - Automatiquement quand on pousse un tag vX.Y (ex. v1.1)
#   -> Release GitHub « NounoursOS X.Y » avec les ISO.
on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Édition(s) à construire"
        type: choice
        options: [les-deux, desktop, server]
        default: les-deux
      publier:
        description: "Publier une Release GitHub avec les ISO"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  preparer:
    runs-on: ubuntu-latest
    outputs:
      editions: ${{ steps.e.outputs.editions }}
    steps:
      - id: e
        run: |
          case "${{ inputs.edition }}" in
            desktop) echo 'editions=["desktop"]' >> "$GITHUB_OUTPUT" ;;
            server)  echo 'editions=["server"]'  >> "$GITHUB_OUTPUT" ;;
            *)       echo 'editions=["desktop","server"]' >> "$GITHUB_OUTPUT" ;;
          esac

  iso:
    needs: preparer
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJSON(needs.preparer.outputs.editions) }}
    steps:
      - uses: actions/checkout@v4

      - name: Libérer de l'espace disque
        run: |
          df -h / /mnt || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          sudo docker image prune --all --force || true
          df -h / /mnt || true

      - name: Construire l'ISO ${{ matrix.edition }} (Debian 13 en conteneur)
        run: |
          # On construit sur le plus grand disque disponible (/mnt s'il existe)
          WORK=/mnt/nounoursos
          if ! sudo mkdir -p "$WORK" 2>/dev/null; then WORK="$RUNNER_TEMP/nounoursos"; mkdir -p "$WORK"; fi
          sudo cp -a . "$WORK/"
          sudo docker run --rm --privileged \
            -v "$WORK:/src" -w /src/iso \
            debian:trixie bash -c "
              set -e
              apt-get update -q
              apt-get install -y -q live-build curl ca-certificates
              ./build.sh ${{ matrix.edition }}
            "
          sudo chown -R "$(id -u):$(id -g)" "$WORK/iso/out"
          mkdir -p sortie && cp "$WORK"/iso/out/* sortie/
          ls -lh sortie

      - name: Découper si l'ISO dépasse 2 Gio (limite des Releases GitHub)
        run: |
          cd sortie
          for iso in *.iso; do
            size=$(stat -c %s "$iso")
            if [ "$size" -ge 2000000000 ]; then
              echo "ISO de $((size/1024/1024)) Mo : découpage en morceaux de 1900 Mo"
              split -b 1900M -d -a 1 "$iso" "$iso.part"
              rm "$iso"
            fi
          done
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: NounoursOS-${{ matrix.edition }}
          path: sortie/*
          retention-days: 7
          compression-level: 0

  release:
    needs: iso
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: sortie
          merge-multiple: true
      - name: Publier la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . iso/VERSION
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) TAG="v${VERSION}" ;; esac
          {
            echo "## NounoursOS ${VERSION} « ${CODENAME} »"
            echo
            [ -f "nouveautes/${VERSION}.md" ] && cat "nouveautes/${VERSION}.md" && echo
            echo "### Télécharger"
            echo
            echo "- **NounoursOS** (bureau KDE) : \`NounoursOS-desktop-${VERSION}-amd64.iso\`"
            echo "- **NounoursOS Server** : \`NounoursOS-server-${VERSION}-amd64.iso\`"
            echo
            echo "Copier l'ISO sur une clé USB avec Rufus (mode DD), Balena Etcher ou \`dd\`."
            if ls sortie/*.part* >/dev/null 2>&1; then
              echo
              echo "### ⚠️ ISO en plusieurs morceaux"
              echo "GitHub limite chaque fichier à 2 Gio. Télécharge **tous** les \`.part\`, le \`.sha256\` et l'outil de fusion dans le même dossier :"
              echo
              echo "- **Windows** : double-clic sur \`fusionner-iso.bat\`"
              echo "- **macOS / Linux** : dans un Terminal, \`sh fusionner-iso.sh\`"
              echo
              echo "L'outil recolle les morceaux et vérifie que l'ISO est intacte."
            fi
            echo
            echo "Empreintes SHA-256 : fichiers \`.sha256\`."
          } > notes.md
          # Outils de fusion joints à la Release si une ISO est en morceaux
          if ls sortie/*.part* >/dev/null 2>&1; then
            cp iso/outils/fusionner-iso.bat iso/outils/fusionner-iso.sh sortie/
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" sortie/* --clobber
          else
            gh release create "$TAG" sortie/* --title "NounoursOS ${VERSION} « ${CODENAME} »" --notes-file notes.md
          fi
