name: Construire NounoursNT

# NounoursNT : système NT de NounoursCorp, construit à partir des sources de LiberNT
# (https://github.com/LiberNT/LiberNT) et rebaptisé par nounoursnt/rebaptiser.py
# (sans le nom ni le logo de LiberNT, comme le demande sa politique de marque).
# Construction AMD64 (Clang, Debug comme les images de LiberNT), test de démarrage
# dans QEMU, puis Release « nounoursnt-… » si « publier » est coché.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branche, étiquette ou commit de LiberNT"
        default: master
      publier:
        description: "Publier une Release NounoursNT (vérifier d'abord les captures du test !)"
        type: boolean
        default: false
      comparer:
        description: "Construire aussi LiberNT non modifié, pour comparer le démarrage"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  construire:
    strategy:
      fail-fast: false
      matrix:
        variante: ${{ fromJSON(inputs.comparer && '["nounoursnt","libernt"]' || '["nounoursnt"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/share/swift /usr/lib/jvm /usr/local/share/powershell /usr/local/share/chromium
          sudo docker system prune --all --force
          df -h /

      - name: Sources NounoursOS (identité, script de rebaptême)
        uses: actions/checkout@v4
        with:
          path: nounoursos

      - name: Sources LiberNT
        uses: actions/checkout@v4
        with:
          repository: LiberNT/LiberNT
          ref: ${{ inputs.ref }}
          path: nounoursnt
          lfs: false

      - name: Outils
        run: |
          for essai in 1 2 3 4; do
            sudo apt-get update && sudo apt-get install -y cmake ninja-build flex bison ccache wget xz-utils tar \
              python3-mako python3-yaml python3-packaging glslang-tools msitools \
              librsvg2-bin python3-pil fonts-inter qemu-system-x86 qemu-utils ovmf zip socat && break
            sleep $((30 * essai))
          done
          fc-cache -f >/dev/null

      - name: "NounoursNT : nom et identité"
        run: |
          cd nounoursnt
          echo "LIBERNT_SHA=$(git rev-parse --short=11 HEAD)" >> "$GITHUB_ENV"
          if [ "${{ matrix.variante }}" = nounoursnt ]; then
            python3 ../nounoursos/nounoursnt/rebaptiser.py .
          else
            echo "LiberNT non modifié (comparaison uniquement, jamais publié)" > NOUNOURSNT.md
          fi

      - name: Chaîne de compilation (RosBE)
        id: rosbe
        run: |
          curl -fsSL https://raw.githubusercontent.com/LiberNT/libernt-build-toolchain/main/rosbe-unix-bootstrap.sh -o /tmp/rosbe-bootstrap.sh
          echo "sha=$(sha1sum /tmp/rosbe-bootstrap.sh | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.local/opt/rosbe
          key: rosbe-${{ runner.os }}-${{ steps.rosbe.outputs.sha }}
      - name: Installer RosBE
        run: |
          [ -f "$HOME/.local/opt/rosbe/rosbe-env.sh" ] && exit 0
          for essai in 1 2 3 4; do sh /tmp/rosbe-bootstrap.sh && break; sleep $((60 * essai)); done

      - uses: actions/cache@v4
        with:
          path: ccache
          key: nounoursnt-ccache-${{ github.run_id }}
          restore-keys: nounoursnt-ccache-

      - name: Configurer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE/nounoursnt" >> $GITHUB_ENV
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=3G" >> $GITHUB_ENV
          . "$HOME/.local/opt/rosbe/rosbe-env.sh"
          cd nounoursnt
          ./configure.sh --clang -a amd64 -DREACTOS_TARGET_NT=0xA00 -DENABLE_CCACHE=1

      - name: Compiler
        run: |
          . "$HOME/.local/opt/rosbe/rosbe-env.sh"
          cd nounoursnt
          ninja -C output-Clang-amd64-debug submodules
          ninja -C output-Clang-amd64-debug bootcd liberntimg

      - name: Rassembler
        run: |
          O=nounoursnt/output-Clang-amd64-debug
          mkdir -p sortie
          NOM="NounoursNT-amd64-${LIBERNT_SHA}"
          cp "$O/bootcd.iso" "sortie/$NOM.iso"
          cp "$O/LiberNT.img" sortie/NounoursNT.img
          (cd sortie && zip -9 "$NOM-disque.zip" NounoursNT.img && rm NounoursNT.img)
          cp nounoursnt/NOUNOURSNT.md sortie/LISEZMOI-NounoursNT.md
          (cd sortie && sha256sum * > SHA256SUMS)
          ls -lh sortie

      - name: Test de démarrage (QEMU)
        run: |
          sudo chmod 666 /dev/kvm || true
          mkdir -p captures
          unzip -o sortie/*-disque.zip -d /tmp/nnt
          qemu-img convert -f raw -O qcow2 /tmp/nnt/NounoursNT.img /tmp/nnt/d.qcow2
          cp /usr/share/OVMF/OVMF_VARS_4M.fd /tmp/nnt/vars.fd
          qemu-system-x86_64 -machine q35 -accel kvm -cpu host -smp 2 -m 2048 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=/tmp/nnt/vars.fd \
            -drive if=none,id=d,format=qcow2,file=/tmp/nnt/d.qcow2 -device ide-hd,drive=d \
            -vga std -device qemu-xhci -device usb-tablet -nic user,model=e1000 \
            -display none -monitor unix:/tmp/nnt/mon,server,nowait -serial file:captures/serie.log &
          prev=0
          for t in 20 60 150; do
            sleep $((t - prev)); prev=$t
            echo "screendump captures/nounoursnt-${t}s.ppm" | socat - UNIX-CONNECT:/tmp/nnt/mon || true
            sleep 3
          done
          kill %1 || true
          for f in captures/*.ppm; do python3 -c "from PIL import Image; Image.open('$f').save('${f%.ppm}.png')"; rm "$f"; done
          ls -l captures

      - uses: actions/upload-artifact@v4
        with:
          name: captures-${{ matrix.variante }}
          path: captures/

      - name: Publier la Release
        if: ${{ inputs.publier && matrix.variante == 'nounoursnt' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="nounoursnt-$(date +%Y%m%d)-${LIBERNT_SHA}"
          {
            echo "## NounoursNT (aperçu de développement)"
            echo
            echo "Système d'exploitation NT de NounoursCorp, **basé sur les sources de [LiberNT](https://github.com/LiberNT/LiberNT)** (commit \`${LIBERNT_SHA}\`), lui-même issu de ReactOS."
            echo "Le nom et le logo de LiberNT ont été remplacés par l'identité NounoursOS, comme le demande la politique de marque de LiberNT. NounoursNT n'est pas un produit du projet LiberNT."
            echo
            echo "⚠️ Version de développement (Debug) : à essayer **dans une machine virtuelle**, pas sur un ordinateur important."
            echo
            echo "### Fichiers"
            echo "- \`…-amd64-….iso\` : CD de démarrage (essai ou installation)"
            echo "- \`…-disque.zip\` : disque préinstallé \`NounoursNT.img\` (QEMU, ou VirtualBox après conversion)"
            echo
            echo "### Démarrer dans QEMU"
            echo '```'
            echo 'qemu-system-x86_64 -machine q35 -accel kvm -cpu host -smp 2 -m 2048 \'
            echo '  -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \'
            echo '  -drive if=pflash,format=raw,file=OVMF_VARS.fd \'
            echo '  -drive if=none,id=d,format=raw,file=NounoursNT.img -device ide-hd,drive=d \'
            echo '  -vga std -device qemu-xhci -device usb-tablet -nic user,model=e1000'
            echo '```'
            echo
            echo "Licence : GNU GPL 3.0 (le code repris garde sa licence d'origine). Sources : LiberNT \`${LIBERNT_SHA}\` + [nounoursnt/rebaptiser.py](https://github.com/${GITHUB_REPOSITORY}/blob/main/nounoursnt/rebaptiser.py)."
          } > notes.md
          gh release create "$TAG" sortie/* captures/*.png --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "NounoursNT — aperçu ${LIBERNT_SHA}" --notes-file notes.md
